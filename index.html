<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sejam bem vindos à Nossa COMUNIDADE | Rotina de Operadoras de Caixa Anônimas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topo-neon">
  <img src="https://th.bing.com/th/id/R.72030036864eee7b7bd3d9b8766a308f?rik=DIfq%2fy%2b%2f4KNR0g&riu=http%3a%2f%2fwww.i2symbol.com%2fpictures%2femojis%2f1%2f7%2f6%2fd%2f176ddf308ac2b261f77299113d78faf6.png&ehk=WduIYGmfykZmMrmPMDPI2puFNBkaNg8Wieotuw0c9mA%3d&risl=&pid=ImgRaw&r=0" class="operadores">
</header>
  
  <header class="titulo-topo">
    Sejam bem vindos a Nossa COMUNIDADE!<br>
    <span style="font-size:20px;">
      Rotina de Operadoras de Caixa Anônimas
    </span>
  </header>

  <img src="https://th.bing.com/th/id/R.72030036864eee7b7bd3d9b8766a308f?rik=DIfq%2fy%2b%2f4KNR0g&riu=http%3a%2f%2fwww.i2symbol.com%2fpictures%2femojis%2f1%2f7%2f6%2fd%2f176ddf308ac2b261f77299113d78faf6.png&ehk=WduIYGmfykZmMrmPMDPI2puFNBkaNg8Wieotuw0c9mA%3d&risl=&pid=ImgRaw&r=0" class="operadores">
</div>


<div id="login">
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="senha" placeholder="Senha">

  <button onclick="entrar()">Entrar</button>
  <button onclick="cadastrar()">Cadastrar</button>
</div>

  <!-- ÁREA PRIVADA -->
  <div id="areaPrivada">
    <textarea id="comentario" placeholder="Escreva sobre sua rotina..."></textarea>
    <input type="file" id="midia" accept="image/*,video/*">
    <button onclick="publicar()">Publicar</button>
    <div id="posts"></div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js";
  import {
    getAuth,
    signInWithEmailAndPassword,
    createUserWithEmailAndPassword,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js";
  import {
    getFirestore,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    deleteDoc,
    doc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAzmBG2rQy7NdMRcoMwgvMmyTkDow0vNzA",
    authDomain: "operadorasanonimas.firebaseapp.com",
    projectId: "operadorasanonimas",
    storageBucket: "operadorasanonimas.firebasestorage.app",
    messagingSenderId: "214106326196",
    appId: "1:214106326196:web:7702707ae9b5db846503e1"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let usuarioAtual = null;

  const loginDiv = document.getElementById("login");
  const areaPrivada = document.getElementById("areaPrivada");
  const postsDiv = document.getElementById("posts");

  window.entrar = function () {
    signInWithEmailAndPassword(
      auth,
      email.value,
      senha.value
    ).catch(() => alert("Email ou senha inválidos"));
  };

  window.cadastrar = function () {
    if (senha.value.length < 6) {
      alert("Senha mínima de 6 caracteres");
      return;
    }

    createUserWithEmailAndPassword(auth, email.value, senha.value)
      .catch(e => {
        if (e.code === "auth/email-already-in-use") {
          alert("Email já cadastrado");
        } else {
          alert("Erro ao cadastrar");
        }
      });
  };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      usuarioAtual = user;
      loginDiv.style.display = "none";
      areaPrivada.style.display = "block";
      carregarComentarios();
    } else {
      usuarioAtual = null;
      loginDiv.style.display = "block";
      areaPrivada.style.display = "none";
    }
  });

  window.publicar = async function () {
    if (!comentario.value.trim()) return;

    await addDoc(collection(db, "posts"), {
      texto: comentario.value,
      email: usuarioAtual.email,
      uid: usuarioAtual.uid,
      criadoEm: serverTimestamp()
    });

    comentario.value = "";
  };

  function formatarData(timestamp) {
    if (!timestamp) return "Data desconhecida";
    const data = timestamp.toDate();
    return data.toLocaleDateString("pt-BR") + " " + data.toLocaleTimeString("pt-BR");
  }

  function carregarComentarios() {
    const q = query(
      collection(db, "posts"),
      orderBy("criadoEm", "desc")
    );

    onSnapshot(q, (snapshot) => {
      postsDiv.innerHTML = "";

      snapshot.forEach((docSnap) => {
        const post = docSnap.data();
        const div = document.createElement("div");
        div.className = "post";

        // Exibir timestamp formatado
        const timestampDiv = document.createElement("div");
        timestampDiv.className = "post-timestamp";
        timestampDiv.textContent = formatarData(post.criadoEm);
        div.appendChild(timestampDiv);

        // Exibir apenas o texto do post (SEM EMAIL)
        const textoDiv = document.createElement("div");
        textoDiv.innerHTML = post.texto.replace(/\n/g, "<br>");
        div.appendChild(textoDiv);

        // Botão de exclusão apenas para o proprietário do post
        if (usuarioAtual.uid === post.uid) {
          const actionsDiv = document.createElement("div");
          actionsDiv.className = "post-actions";
          
          const btn = document.createElement("button");
          btn.textContent = "🗑️ Excluir";
          btn.onclick = () => excluirComentario(docSnap.id);
          actionsDiv.appendChild(btn);
          
          div.appendChild(actionsDiv);
        }

        postsDiv.appendChild(div);
      });
    });
  }

  async function excluirComentario(id) {
    if (confirm("Excluir comentário?")) {
      await deleteDoc(doc(db, "posts", id));
    }
  }
</script>


</body>
</html>
